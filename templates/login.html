{% extends "base.html" %}
{% block title %}Login — RentManager{% endblock %}
{% block auth_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:1rem;position:relative;overflow:hidden;">
  <!-- Subtle ledger-ruling texture instead of a generic radial glow -->
  <div style="position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:repeating-linear-gradient(180deg,transparent,transparent 34px,rgba(198,138,61,0.035) 34px,rgba(198,138,61,0.035) 35px);"></div>
  <div style="position:absolute;width:520px;height:520px;background:radial-gradient(circle,rgba(198,138,61,0.07) 0%,transparent 70%);top:38%;left:50%;transform:translate(-50%,-50%);pointer-events:none;"></div>

  <div style="width:100%;max-width:400px;position:relative;animation:fadeUp 0.5s ease both;">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:50px;height:50px;background:var(--gold);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:1.3rem;color:#14110D;margin-bottom:1.1rem;">
        <i class="bi bi-building"></i>
      </div>
      <div style="font-family:var(--font-serif);font-weight:600;font-size:1.6rem;color:var(--text);margin-bottom:5px;letter-spacing:-.01em;">RentManager</div>
      <div style="font-size:0.72rem;color:var(--text-faint);letter-spacing:0.1em;text-transform:uppercase;">Admin Portal</div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:var(--radius-lg);padding:1.85rem;">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}" style="margin-bottom:1.25rem;">
            <i class="bi bi-exclamation-circle"></i><span>{{ msg }}</span>
            <button class="btn-close-alert" onclick="this.parentElement.remove()">×</button>
          </div>
        {% endfor %}
      {% endwith %}
      <form method="POST" autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group" style="margin-bottom:1rem;">
          <label>Username</label>
          <input class="form-control" type="text" name="username" placeholder="admin" required autofocus style="font-size:1rem;padding:.65rem .85rem;" />
        </div>
        <div class="form-group" style="margin-bottom:1.75rem;">
          <label>Password</label>
          <input class="form-control" type="password" name="password" placeholder="••••••••" required style="font-size:1rem;padding:.65rem .85rem;" />
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;padding:.75rem;font-size:.95rem;justify-content:center;">
          <i class="bi bi-arrow-right-circle"></i> Sign in
        </button>
      </form>
    </div>
  </div>
</div>
<style>@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}</style>
{% endblock %}
