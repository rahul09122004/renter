{% extends "base.html" %}
{% block title %}Security — RentManager{% endblock %}
{% block page_title %}Security Settings{% endblock %}
{% block content %}
<div style="max-width:520px;" class="fade-up d1">

  <!-- Change Username Card -->
  <div class="card" style="margin-bottom:1.25rem;">
    <div class="card-header">
      <span><i class="bi bi-person-gear" style="margin-right:7px;color:#a855f7;"></i>Change Username</span>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('change_username') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group" style="margin-bottom:1rem;">
          <label>Current Username</label>
          <input class="form-control" type="text" value="{{ session.get('admin_username','') }}" disabled style="opacity:.6;" />
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label>New Username</label>
          <input class="form-control" type="text" name="new_username" placeholder="Enter new username" minlength="3" maxlength="40" required />
        </div>
        <div class="form-group" style="margin-bottom:1.75rem;">
          <label>Confirm with Password</label>
          <input class="form-control" type="password" name="confirm_password_username" placeholder="Your current password" required />
        </div>
        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn" style="background:var(--purple-bg);color:#c084fc;border-color:rgba(168,85,247,.25);">
            <i class="bi bi-person-check"></i> Update Username
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Change Password Card -->
  <div class="card">
    <div class="card-header">
      <span><i class="bi bi-shield-lock" style="margin-right:7px;color:#60a5fa;"></i>Change Password</span>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('change_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group" style="margin-bottom:1rem;">
          <label>Current Password</label>
          <input class="form-control" type="password" name="current_password" placeholder="••••••••" required />
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label>New Password</label>
          <input class="form-control" type="password" name="new_password" placeholder="min. 6 characters" minlength="6" required />
        </div>
        <div class="form-group" style="margin-bottom:1.75rem;">
          <label>Confirm New Password</label>
          <input class="form-control" type="password" name="confirm_password" placeholder="repeat new password" minlength="6" required />
        </div>
        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn btn-gold"><i class="bi bi-save"></i> Update Password</button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
