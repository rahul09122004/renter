<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ status }} — RentManager</title>
<style>body{margin:0;background:#0f1117;color:#e8eaf0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:1rem}
.box{max-width:440px;text-align:center}.code{font-size:3.5rem;font-weight:700;color:#e8a020}h1{font-size:1.3rem;margin:.3rem 0}p{color:#8b93a8;line-height:1.6}
a{color:#e8a020}small{color:#4a5168}</style></head>
<body><div class="box"><div class="code">{{ status }}</div><h1>{{ title }}</h1><p>{{ message }}</p>
<p><a href="/">Go to the dashboard</a></p><small>Reference: {{ request_id }}</small></div></body></html>
